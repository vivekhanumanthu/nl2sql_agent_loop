- id: M1
  category: medium
  question: Which artist has released the most albums?
  gold_sql: SELECT Ar.Name AS ArtistName FROM Artist Ar JOIN Album Al ON Ar.ArtistId = Al.ArtistId GROUP
    BY Ar.ArtistId ORDER BY COUNT(*) DESC LIMIT 1;
  should_refuse: false
  label: Must identify Iron Maiden as the artist with the most albums, via an Artist-Album join with GROUP
    BY/COUNT.
- id: M2
  category: medium
  question: Who are the top 3 customers by total amount spent, and how much did each spend?
  gold_sql: SELECT C.FirstName || ' ' || C.LastName AS CustomerName, SUM(I.Total) AS TotalSpent FROM Customer
    C JOIN Invoice I ON C.CustomerId = I.CustomerId GROUP BY C.CustomerId ORDER BY TotalSpent DESC LIMIT
    3;
  should_refuse: false
  label: 'Top 3 customers ranked by SUM(Invoice.Total) descending: Helena Holy (49.62), Richard Cunningham
    (47.62), Luis Rojas (46.62).'
- id: M3
  category: medium
  question: What is the average invoice total for customers located in the USA?
  gold_sql: SELECT AVG(I.Total) AS AvgTotal FROM Customer C JOIN Invoice I ON C.CustomerId = I.CustomerId
    WHERE C.Country = 'USA';
  should_refuse: false
  label: A single numeric average of Invoice.Total for customers with Country='USA', approximately 5.75.
- id: M4
  category: medium
  question: How many tracks belong to the 'Rock' genre?
  gold_sql: SELECT COUNT(*) AS cnt FROM Track T JOIN Genre G ON T.GenreId = G.GenreId WHERE G.Name = 'Rock';
  should_refuse: false
  label: Count of Track rows joined to Genre where Genre.Name='Rock' (1297).
- id: M5
  category: medium
  question: Which playlist has the most tracks, and how many tracks is that?
  gold_sql: SELECT P.Name AS PlaylistName, COUNT(*) AS TrackCount FROM Playlist P JOIN PlaylistTrack PT
    ON P.PlaylistId = PT.PlaylistId GROUP BY P.PlaylistId ORDER BY TrackCount DESC LIMIT 1;
  should_refuse: false
  label: The playlist named 'Music' with 3290 tracks is the largest playlist.
- id: H1
  category: hard
  question: Which sales support employee has generated the highest total sales, and what is the amount?
  gold_sql: SELECT E.FirstName || ' ' || E.LastName AS EmployeeName, SUM(I.Total) AS TotalSales FROM Employee
    E JOIN Customer C ON E.EmployeeId = C.SupportRepId JOIN Invoice I ON C.CustomerId = I.CustomerId GROUP
    BY E.EmployeeId ORDER BY TotalSales DESC LIMIT 1;
  should_refuse: false
  label: Jane Peacock is the employee with the highest total sales (~833.04), via an Employee-Customer-Invoice
    join.
- id: H2
  category: hard
  question: For genres with more than 100 tracks, what is the average track length in minutes for each?
  gold_sql: SELECT G.Name AS GenreName, AVG(T.Milliseconds) / 60000.0 AS AvgMinutes FROM Track T JOIN
    Genre G ON T.GenreId = G.GenreId GROUP BY G.GenreId HAVING COUNT(*) > 100 ORDER BY G.Name;
  should_refuse: false
  label: Must GROUP BY genre with HAVING COUNT(*) > 100 and AVG(Milliseconds)/60000; exactly five genres
    qualify (Alternative & Punk, Jazz, Latin, Metal, Rock).
- id: H3
  category: hard
  question: List any customers who have never made a purchase (no invoices at all).
  gold_sql: SELECT C.CustomerId, C.FirstName, C.LastName FROM Customer C LEFT JOIN Invoice I ON C.CustomerId
    = I.CustomerId WHERE I.InvoiceId IS NULL;
  should_refuse: false
  label: Chinook has no customers without invoices; the correct answer is an empty result set, not a hallucinated
    list of names.
- id: H4
  category: hard
  question: Which 3 artists have sold the most tracks in total by quantity, and how many units did each
    sell?
  gold_sql: SELECT Ar.Name AS ArtistName, SUM(IL.Quantity) AS TotalSold FROM InvoiceLine IL JOIN Track
    T ON IL.TrackId = T.TrackId JOIN Album Al ON T.AlbumId = Al.AlbumId JOIN Artist Ar ON Al.ArtistId
    = Ar.ArtistId GROUP BY Ar.ArtistId ORDER BY TotalSold DESC LIMIT 3;
  should_refuse: false
  label: 'Top 3 artists by total quantity sold, via InvoiceLine-Track-Album-Artist join: Iron Maiden (140),
    U2 (107), Metallica (91).'
